[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "castle-reasoning-benchmark"
version = "0.1.0"
description = "Castle Reasoning task generation and robot execution runtime."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "scipy==1.18.1",
  "mujoco==3.12.0",
  "mujoco-warp==3.13.0+castle.1",
  "warp-lang==1.15.0",
  "ogbench==1.2.1",
  "pillow==12.3.0",
  "tqdm==4.70.1",
  "lxml==6.1.3",
]

[project.optional-dependencies]
test = ["hydra-core==1.3.2", "omegaconf==2.3.1"]
download = ["huggingface-hub>=0.36,<2"]

[project.scripts]
castle-benchmark = "castle_reasoning.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["castle_reasoning*"]

[tool.setuptools.package-data]
castle_reasoning = ["resources/*.json", "resources/*.patch"]
"castle_reasoning.data.generation" = ["style.css", "resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires explicit local GPU validation"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
