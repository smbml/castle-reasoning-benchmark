[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-warp"
version = "3.13.0+castle.1"
description = "MuJoCo-Warp 3.13.0 with Castle's hash-checked active-world patch."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "AUTHORS"]
dependencies = ["absl-py", "etils[epath]", "mujoco==3.12.0", "numpy==2.5.2", "warp-lang==1.15.0"]

[tool.setuptools.packages.find]
include = ["mujoco_warp*"]

[tool.setuptools.package-data]
mujoco_warp = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
